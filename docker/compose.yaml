# Local API stand-in. Prism serves the contract itself, so the mock cannot drift from
# the spec the app is generated against.
#
#   npm run mock:start    start it in the background on http://localhost:4010/api/v1
#   npm run mock:logs     follow request logs
#   npm run mock:stop     stop and remove it
#
# Android emulators reach this at http://10.0.2.2:4010.
services:
  prism:
    image: stoplight/prism:5
    # The published image is amd64 only; stated explicitly so Apple silicon does not warn.
    platform: linux/amd64
    container_name: voltique-mock-prism
    # --multiprocess crashes in this image, so the forked log processor stays off.
    command: >
      mock /contract/openapi.yaml
      --host 0.0.0.0
      --port 4010
      --multiprocess false
    volumes:
      - ../src/contract:/contract:ro
    expose:
      - '4010'

  api:
    image: nginx:1.27-alpine
    container_name: voltique-mock-api
    depends_on:
      - prism
    ports:
      - '4010:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/health']
      interval: 10s
      timeout: 3s
      retries: 5
