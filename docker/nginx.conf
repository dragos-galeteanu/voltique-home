# Prism serves the contract's paths at the root, with no knowledge of the /api/v1
# prefix that the real API is mounted under. This proxy puts the prefix back, so the
# app talks to the mock with exactly the URLs it sends to production.
server {
  listen 80;

  location /api/v1/ {
    proxy_pass http://prism:4010/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location = /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
