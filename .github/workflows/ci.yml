name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate the API contract
        run: npm run contract:lint

      - name: Check the generated client is current
        run: |
          npm run codegen
          git diff --exit-code src/api/generated \
            || (echo "::error::src/api/generated is stale. Run npm run codegen and commit." && exit 1)

      - name: Generate route types
        run: npm run typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm test -- --ci --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Catches anything that only fails when Metro resolves the whole graph.
      - name: Bundle both platforms
        run: npx expo export --platform ios --platform android --output-dir dist
        env:
          APP_VARIANT: development
