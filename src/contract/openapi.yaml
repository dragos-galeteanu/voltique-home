openapi: 3.1.0
info:
  title: Voltique API
  version: 1.0.0
  description: |
    Household energy management. Consumers own households and the energy assets in
    them; installers get scoped access to households that invited them.

    Conventions:
      * JSON bodies are camelCase, so no transform layer sits between API and store.
      * Timestamps are ISO 8601 with an offset, and the app formats to local time.
      * Power is watts, energy is watt-hours, and every value carries its unit.
      * Collections paginate by cursor. Telemetry is the exception: it is bounded by a
        time range and returns whole series.
      * Errors are RFC 9457 problem details with a stable machine-readable `code`.
servers:
  - url: https://api.voltique.example/api/v1
    description: Production
  - url: https://staging.api.voltique.example/api/v1
    description: Staging
  - url: http://localhost:4010/api/v1
    description: Local Prism mock
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sessions and tokens.
  - name: CurrentUser
    description: The signed-in user.
  - name: Household
    description: Households and their membership.
  - name: Member
    description: People with access to a household.
  - name: Invite
    description: Invitations, including installer access.
  - name: AssetCatalogue
    description: Asset types, manufacturers and models available to add.
  - name: Asset
    description: Energy assets installed in a household.
  - name: Telemetry
    description: Measured time series.
  - name: Log
    description: Raw device events.
  - name: Alert
    description: Server-derived problems with a lifecycle.
  - name: Device
    description: Handsets registered to receive push notifications.
paths:
  /auth/sessions:
    post:
      operationId: signIn
      summary: Exchange credentials for a session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/current:
    delete:
      operationId: signOut
      summary: Revoke the current session
      tags: [Auth]
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Read the signed-in user
      tags: [CurrentUser]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/registrations:
    post:
      operationId: signUp
      summary: Create an account
      description: |
        Creates a consumer account and signs it in, so the person lands in the app rather
        than back on a sign-in screen. Installers are not created this way: they arrive
        through an invitation.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          description: That address already has an account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Address already registered
                status: 409
                code: email_already_registered
                detail: An account already exists for that email address.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset link
      description: |
        Always answers the same way, whether or not the address has an account. Telling a
        caller which addresses exist would turn this into an account enumeration tool.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: If the address has an account, a link is on its way
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-resets/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque token from the reset link.
        schema:
          type: string
    post:
      operationId: confirmPasswordReset
      summary: Set a new password using a reset link
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: Password changed. Existing sessions are revoked.
        '404':
          description: The link is unknown, expired or already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Link no longer valid
                status: 404
                code: reset_token_invalid
                detail: Ask for a new link and try again.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /users/me/deletion:
    post:
      operationId: deleteAccount
      summary: Delete this account and everything in it
      description: |
        Permanent and immediate. Households the caller owns are deleted with their assets,
        telemetry, logs and alerts; households they merely belong to lose them as a member.
        The current password is required, because a phone left unlocked should not be able
        to erase someone's account.
      tags: [CurrentUser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account deleted. Every session is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The password did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Password incorrect
                status: 403
                code: password_incorrect
                detail: Enter your current password to delete the account.
  /households:
    get:
      operationId: listHouseholds
      summary: List households the caller can access
      description: |
        Consumers see the households they belong to. Installers see the households that
        invited them, with the fields their scope allows.
      tags: [Household]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of households
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createHousehold
      summary: Create a household
      tags: [Household]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreate'
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /households/{householdId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: getHousehold
      summary: Read a household
      tags: [Household]
      responses:
        '200':
          description: The household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateHousehold
      summary: Update a household
      tags: [Household]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdUpdate'
      responses:
        '200':
          description: The updated household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteHousehold
      summary: Delete a household and everything in it
      tags: [Household]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{householdId}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdMembers
      summary: List the people with access to a household
      tags: [Member]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
              example:
                nextCursor: null
                data:
                  - userId: 6f1e2d3c-4b5a-4c7d-8e9f-0a1b2c3d4e5f
                    displayName: Ada
                    email: ada@example.com
                    membershipRole: owner
                    joinedAt: '2026-02-02T10:00:00Z'
                  - userId: 7a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    displayName: Sam
                    email: sam@example.com
                    membershipRole: resident
                    joinedAt: '2026-02-04T18:30:00Z'
                  - userId: 8b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                    displayName: Nadia at Voltfix
                    email: nadia@voltfix.example
                    membershipRole: installer
                    joinedAt: '2026-05-20T08:15:00Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeHouseholdMember
      summary: Revoke a person's access to a household
      tags: [Member]
      responses:
        '204':
          description: Access revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /households/{householdId}/invites:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdInvites
      summary: List invites for a household
      tags: [Invite]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InviteStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
              example:
                nextCursor: null
                data:
                  - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    householdId: 11111111-1111-4111-8111-111111111111
                    email: tom@voltfix.example
                    membershipRole: installer
                    status: pending
                    invitedByUserId: 6f1e2d3c-4b5a-4c7d-8e9f-0a1b2c3d4e5f
                    createdAt: '2026-09-10T09:00:00Z'
                    expiresAt: '2026-09-17T09:00:00Z'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createHouseholdInvite
      summary: Invite someone to a household
      description: |
        Used both for another resident and for an installer. The membership role in the
        request decides what the invitee will be able to see.
      tags: [Invite]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeInvite
      summary: Revoke a pending invite
      tags: [Invite]
      responses:
        '204':
          description: Invite revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque token from the invitation link.
        schema:
          type: string
    post:
      operationId: acceptInvite
      summary: Accept an invitation
      tags: [Invite]
      responses:
        '200':
          description: The household the caller now has access to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /devices:
    get:
      operationId: listDevices
      summary: List the devices registered for notifications
      tags: [Device]
      responses:
        '200':
          description: The caller's devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              example:
                - id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                  platform: ios
                  label: Ada's iPhone
                  notifications:
                    enabled: true
                    minSeverity: warning
                  createdAt: '2026-09-01T08:00:00Z'
                  lastSeenAt: '2026-09-12T08:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: registerDevice
      summary: Register this device for push notifications
      description: |
        Called after signing in, once the person has allowed notifications. Registering
        the same token twice updates the existing record rather than creating another, so
        a reinstall or a token refresh cannot produce duplicates.
      tags: [Device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '200':
          description: The device, whether newly registered or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                platform: ios
                label: Ada's iPhone
                notifications:
                  enabled: true
                  minSeverity: warning
                createdAt: '2026-09-01T08:00:00Z'
                lastSeenAt: '2026-09-12T08:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateDeviceNotifications
      summary: Change what this device is notified about
      tags: [Device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: The updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unregisterDevice
      summary: Stop sending notifications to this device
      description: Called on sign out, so a shared handset stops receiving someone else's faults.
      tags: [Device]
      responses:
        '204':
          description: Unregistered
        '404':
          $ref: '#/components/responses/NotFound'
  /asset-types:
    get:
      operationId: listAssetTypes
      summary: List the kinds of asset that can be added
      tags: [AssetCatalogue]
      responses:
        '200':
          description: Asset types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetType'
              example:
                - id: solar_inverter
                  name: Solar inverter
                  category: production
                  metrics: [power, energy]
                - id: battery
                  name: Home battery
                  category: storage
                  metrics: [power, energy, stateOfCharge]
                - id: ev_charger
                  name: EV charger
                  category: consumption
                  metrics: [power, energy]
                - id: heat_pump
                  name: Heat pump
                  category: consumption
                  metrics: [power, energy, temperature]
                - id: generator
                  name: Generator
                  category: production
                  metrics: [power, energy]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /manufacturers:
    get:
      operationId: listManufacturers
      summary: List manufacturers, optionally for one asset type
      tags: [AssetCatalogue]
      parameters:
        - name: assetTypeId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manufacturer'
              example:
                - id: sunra
                  name: Sunra
                  assetTypeIds: [solar_inverter, battery]
                - id: voltbox
                  name: Voltbox
                  assetTypeIds: [ev_charger]
                - id: thermeo
                  name: Thermeo
                  assetTypeIds: [heat_pump]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /manufacturers/{manufacturerId}/models:
    parameters:
      - name: manufacturerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listManufacturerModels
      summary: List a manufacturer's models
      description: |
        Each model declares the parameters the platform needs to reach the device
        through the manufacturer's integration. The app renders the connect form from
        this, so adding a manufacturer never needs an app release.
      tags: [AssetCatalogue]
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetModel'
              example:
                - id: sunra-x7
                  manufacturerId: sunra
                  assetTypeId: solar_inverter
                  name: Sunra X7
                  ratedPowerW: 7000
                  connectionParameters:
                    - key: serialNumber
                      label: Serial number
                      type: text
                      required: true
                      helpText: Printed on the label beside the DC isolator.
                      pattern: '^[A-Z0-9]{8,16}$'
                    - key: cloudPin
                      label: Installer PIN
                      type: password
                      required: true
                - id: sunra-x10
                  manufacturerId: sunra
                  assetTypeId: solar_inverter
                  name: Sunra X10
                  ratedPowerW: 10000
                  connectionParameters:
                    - key: serialNumber
                      label: Serial number
                      type: text
                      required: true
                    - key: cloudPin
                      label: Installer PIN
                      type: password
                      required: true
                    - key: siteReference
                      label: Site reference
                      type: text
                      required: false
                      helpText: Optional, only if the installer set one.
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{householdId}/assets:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdAssets
      summary: List the assets in a household
      tags: [Asset]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
              example:
                nextCursor: null
                data:
                  - id: 22222222-2222-4222-8222-222222222222
                    householdId: 11111111-1111-4111-8111-111111111111
                    name: Roof array
                    assetTypeId: solar_inverter
                    manufacturerId: sunra
                    modelId: sunra-x7
                    category: production
                    status: online
                    ratedPowerW: 7000
                    lastSeenAt: '2026-09-12T08:55:00Z'
                    latestReading:
                      powerW: 4210
                      energyTodayWh: 18400
                      measuredAt: '2026-09-12T08:55:00Z'
                    openAlertCount: 0
                    createdAt: '2026-02-02T11:30:00Z'
                  - id: 44444444-4444-4444-8444-444444444444
                    householdId: 11111111-1111-4111-8111-111111111111
                    name: Garage charger
                    assetTypeId: ev_charger
                    manufacturerId: voltbox
                    modelId: voltbox-22
                    category: consumption
                    status: offline
                    ratedPowerW: 22000
                    lastSeenAt: '2026-09-11T19:02:00Z'
                    latestReading:
                      powerW: 0
                      energyTodayWh: 7300
                      measuredAt: '2026-09-11T19:02:00Z'
                    openAlertCount: 0
                    createdAt: '2026-03-10T09:00:00Z'
                  - id: 55555555-5555-4555-8555-555555555555
                    householdId: 11111111-1111-4111-8111-111111111111
                    name: Cellar battery
                    assetTypeId: battery
                    manufacturerId: sunra
                    modelId: sunra-cell
                    category: storage
                    status: faulted
                    capacityWh: 10000
                    lastSeenAt: '2026-09-12T08:40:00Z'
                    latestReading:
                      powerW: -1200
                      energyTodayWh: 4100
                      stateOfChargePercent: 62
                      measuredAt: '2026-09-12T08:40:00Z'
                    openAlertCount: 1
                    createdAt: '2026-04-01T14:20:00Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createHouseholdAsset
      summary: Add an asset to a household
      description: |
        Credentials are passed to the manufacturer integration and are never returned by
        any endpoint. The asset starts in `commissioning` until the first successful
        read from the device.
      tags: [Asset]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: Asset added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getAsset
      summary: Read an asset
      tags: [Asset]
      responses:
        '200':
          description: The asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAsset
      summary: Rename an asset or re-supply its credentials
      tags: [Asset]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdate'
      responses:
        '200':
          description: The updated asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
