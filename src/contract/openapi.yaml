  /households/{householdId}/alerts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listHouseholdAlerts
      summary: List problems the platform derived for a household
      description: |
        Alerts are derived server-side from device logs, telemetry thresholds and
        connectivity, then deduplicated into one stateful record per problem. The app
        reads and acknowledges them; it never decides what counts as a fault.
      tags: [Alert]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AlertStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/AlertSeverity'
        - name: assetId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              example:
                nextCursor: null
                data:
                  - id: 33333333-3333-4333-8333-333333333333
                    householdId: 11111111-1111-4111-8111-111111111111
                    assetId: 22222222-2222-4222-8222-222222222222
                    assetName: Roof array
                    code: inverter_grid_voltage
                    severity: critical
                    status: open
                    title: Inverter stopped exporting
                    detail: Grid voltage has been out of range since 07:41.
                    derivedFrom: deviceLog
                    firstSeenAt: '2026-09-12T07:41:12Z'
                    lastSeenAt: '2026-09-12T08:55:00Z'
                    occurrences: 47
                  - id: 66666666-6666-4666-8666-666666666666
                    householdId: 11111111-1111-4111-8111-111111111111
                    assetId: 55555555-5555-4555-8555-555555555555
                    assetName: Cellar battery
                    code: battery_cell_imbalance
                    severity: warning
                    status: acknowledged
                    title: Cell imbalance detected
                    detail: One module is charging more slowly than the rest.
                    derivedFrom: telemetryThreshold
                    firstSeenAt: '2026-09-10T18:20:00Z'
                    lastSeenAt: '2026-09-12T06:10:00Z'
                    occurrences: 9
                    acknowledgedAt: '2026-09-11T09:02:00Z'
                    acknowledgedByUserId: 6f1e2d3c-4b5a-4c7d-8e9f-0a1b2c3d4e5f
                  - id: 77777777-7777-4777-8777-777777777777
                    householdId: 11111111-1111-4111-8111-111111111111
                    assetId: 44444444-4444-4444-8444-444444444444
                    assetName: Garage charger
                    code: charger_unreachable
                    severity: warning
