  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts across every household the caller can see
      description: |
        The cross-household view, which is how an installer sees the estate they look
        after. A consumer gets the same shape, scoped to their own households. The nested
        collection under a household remains the inbox for one home.
      tags: [Alert]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AlertStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/AlertSeverity'
        - name: householdId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              example:
                nextCursor: null
                data:
                  - id: 33333333-3333-4333-8333-333333333333
                    householdId: 11111111-1111-4111-8111-111111111111
                    householdName: Maple Street
                    assetId: 22222222-2222-4222-8222-222222222222
                    assetName: Roof array
                    code: inverter_grid_voltage
                    severity: critical
                    status: open
                    title: Inverter stopped exporting
                    detail: Grid voltage has been out of range since 07:41.
                    derivedFrom: deviceLog
                    firstSeenAt: '2026-09-12T07:41:12Z'
                    lastSeenAt: '2026-09-12T08:55:00Z'
                    occurrences: 47
                  - id: 88888888-8888-4888-8888-888888888888
                    householdId: 99999999-9999-4999-8999-999999999999
                    householdName: Oak Lane
                    assetId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    assetName: Heat pump
                    code: heat_pump_offline
                    severity: warning
                    status: open
                    title: Heat pump has not reported
                    detail: No contact since yesterday evening.
                    derivedFrom: connectivity
                    firstSeenAt: '2026-09-11T19:40:00Z'
                    lastSeenAt: '2026-09-12T08:00:00Z'
                    occurrences: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /alerts/{alertId}:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAlert
      summary: Read one alert
      tags: [Alert]
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAlertStatus
      summary: Acknowledge or resolve an alert
      description: |
        The only writable part of an alert. A resolved alert reopens on its own if the
        underlying condition recurs, which is why the client cannot delete one.
      tags: [Alert]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertStatusUpdate'
      responses:
        '200':
          description: The updated alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      description: Start of the window, inclusive. Optional when browsing logs.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the window, exclusive. Optional when browsing logs.
      schema:
        type: string
        format: date-time
    Resolution:
      name: resolution
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Resolution'
  responses:
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not authenticated
            status: 401
            code: token_invalid
            detail: The access token is missing or has expired.
    Forbidden:
      description: Authenticated, but not permitted for this resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not permitted
            status: 403
            code: household_access_denied
            detail: Your membership of this household does not allow this.
    NotFound:
      description: No such resource, or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
            code: resource_not_found
    Conflict:
      description: The request conflicts with the current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Already invited
            status: 409
            code: invite_already_pending
            detail: That address already has a pending invite for this household.
    UnprocessableEntity:
      description: Well formed, but the values are not acceptable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Credentials rejected by the manufacturer
            status: 422
            code: asset_credentials_rejected
            detail: The serial number and PIN combination was not accepted.
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Too many attempts
            status: 429
            code: rate_limited
            detail: Try again in a minute.
    UpstreamFailure:
      description: The manufacturer integration could not be reached
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Manufacturer unreachable
            status: 502
            code: upstream_unavailable
            detail: The manufacturer's cloud did not respond. The asset was not added.
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable identifier. The app maps this to user-facing copy and
            to retry behaviour, so it must not change once published.
          examples: [asset_credentials_rejected, household_limit_reached]
        instance:
          type: string
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
          # Keeps the mock from handing out a fake cursor that never ends.
          examples: [null]
    UserRole:
      type: string
      enum: [consumer, installer]
    MembershipRole:
      type: string
      description: |
        What someone can do inside one household. Installers see assets, logs and alerts
        but not billing or membership.
      enum: [owner, resident, installer]
    User:
      type: object
      required: [id, email, displayName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
      examples:
        - id: 6f1e2d3c-4b5a-4c7d-8e9f-0a1b2c3d4e5f
          email: ada@example.com
          displayName: Ada
          role: consumer
          createdAt: '2026-01-14T09:12:00Z'
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Lifetime of the access token in seconds.
      examples:
        - accessToken: stub.access.token
          refreshToken: stub.refresh.token
          expiresIn: 900
    Session:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RegistrationRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        acceptedTermsAt:
          type: string
          format: date-time
          description: When the person accepted the terms, if acceptance is recorded.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmation:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
    AccountDeletionRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The current password, as a confirmation that this is deliberate.
    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
    Household:
      type: object
      required: [id, name, timezone, membershipRole, assetCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: IANA zone, used for daily and monthly aggregation boundaries.
          examples: [Europe/Bucharest]
        address:
          $ref: '#/components/schemas/Address'
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
        assetCount:
          type: integer
        openAlertCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      examples:
        - id: 11111111-1111-4111-8111-111111111111
          name: Maple Street
          timezone: Europe/Bucharest
          membershipRole: owner
          assetCount: 4
          openAlertCount: 1
          createdAt: '2026-02-02T10:00:00Z'
    HouseholdCreate:
      type: object
      required: [name, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    HouseholdUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    HouseholdPage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Household'
    Member:
      type: object
      required: [userId, displayName, email, membershipRole, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
        joinedAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    InviteStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    Invite:
      type: object
      required: [id, householdId, email, membershipRole, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/InviteStatus'
        invitedByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      examples:
        - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
          householdId: 11111111-1111-4111-8111-111111111111
          email: tom@voltfix.example
          membershipRole: installer
          status: pending
          invitedByUserId: 6f1e2d3c-4b5a-4c7d-8e9f-0a1b2c3d4e5f
          createdAt: '2026-09-10T09:00:00Z'
          expiresAt: '2026-09-17T09:00:00Z'
    InviteCreate:
      type: object
      required: [email, membershipRole]
      properties:
        email:
          type: string
          format: email
        membershipRole:
          $ref: '#/components/schemas/MembershipRole'
        message:
          type: string
          maxLength: 280
    InvitePage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Invite'
    DevicePlatform:
      type: string
      enum: [ios, android]
    NotificationPreferences:
      type: object
      description: |
        What this handset is told about. Severity is the floor, so choosing critical means
        warnings stay in the app without buzzing anyone at night.
      required: [enabled, minSeverity]
      properties:
        enabled:
          type: boolean
        minSeverity:
          $ref: '#/components/schemas/AlertSeverity'
    DeviceRegistration:
      type: object
      required: [pushToken, platform]
      properties:
        pushToken:
          type: string
          description: |
            Expo push token for this installation. Write only: no endpoint returns it,
            since possessing it is enough to send to the device.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        label:
          type: string
          description: How the person recognises this handset in a list.
        appVersion:
          type: string
        locale:
          type: string
          description: Language to send the notification in, as a BCP 47 tag.
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'
    Device:
      type: object
      required: [id, platform, notifications, createdAt]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        label:
          type: string
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      examples:
        - id: dddddddd-dddd-4ddd-8ddd-dddddddddddd
          platform: ios
          label: Ada's iPhone
          notifications:
            enabled: true
            minSeverity: warning
          createdAt: '2026-09-01T08:00:00Z'
          lastSeenAt: '2026-09-12T08:30:00Z'
    AssetCategory:
      type: string
      description: How an asset participates in the household's energy balance.
      enum: [production, consumption, storage, bidirectional]
    AssetMetric:
      type: string
      enum: [power, energy, stateOfCharge, temperature]
    HouseholdMetric:
      type: string
      enum:
        - production
        - consumption
        - gridImport
        - gridExport
        - batteryCharge
        - batteryDischarge
    Resolution:
      type: string
      description: Bucket size for aggregation. The server downsamples, never the app.
      enum: [minute, quarterHour, hour, day, month]
    Unit:
      type: string
      enum: [W, Wh, percent, celsius]
    AssetType:
      type: object
      required: [id, name, category, metrics]
      properties:
        id:
          type: string
          examples: [ev_charger, solar_inverter, heat_pump, battery, washing_machine]
        name:
          type: string
        category:
          $ref: '#/components/schemas/AssetCategory'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AssetMetric'
      examples:
        - id: solar_inverter
          name: Solar inverter
          category: production
          metrics: [power, energy]
    Manufacturer:
      type: object
      required: [id, name, assetTypeIds]
      properties:
        id:
          type: string
        name:
          type: string
        assetTypeIds:
          type: array
          items:
            type: string
        logoUrl:
          type: string
          format: uri
      examples:
        - id: sunra
          name: Sunra
          assetTypeIds: [solar_inverter, battery]
    ConnectionParameterType:
      type: string
      enum: [text, password, number, select]
    ConnectionParameter:
      type: object
      description: |
        One field the connect form must collect. Rendering the form from this is what
        lets a new manufacturer ship without an app release.
      required: [key, label, type, required]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          $ref: '#/components/schemas/ConnectionParameterType'
        required:
          type: boolean
        helpText:
          type: string
        pattern:
          type: string
          description: Regular expression the value must match.
        options:
          type: array
          description: Present when type is `select`.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
    AssetModel:
      type: object
      required: [id, manufacturerId, assetTypeId, name, connectionParameters]
      properties:
        id:
          type: string
        manufacturerId:
          type: string
        assetTypeId:
          type: string
        name:
          type: string
        ratedPowerW:
          type: number
        capacityWh:
          type: number
        connectionParameters:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionParameter'
      examples:
        - id: sunra-x7
          manufacturerId: sunra
          assetTypeId: solar_inverter
          name: Sunra X7
          ratedPowerW: 7000
          connectionParameters:
            - key: serialNumber
              label: Serial number
              type: text
              required: true
              helpText: Printed on the label beside the DC isolator.
            - key: cloudPin
              label: Installer PIN
              type: password
              required: true
    AssetStatus:
      type: string
      description: |
        `commissioning` until the first successful read. `faulted` means an open alert of
        critical severity, so status and alerts never disagree.
      enum: [commissioning, online, offline, faulted, unknown]
    AssetReading:
      type: object
      description: Latest known values, for list rows and tiles without a series call.
      properties:
        powerW:
          type: number
        energyTodayWh:
          type: number
        stateOfChargePercent:
          type: number
          minimum: 0
          maximum: 100
        measuredAt:
          type: string
          format: date-time
    Asset:
      type: object
      required:
        - id
        - householdId
        - name
        - assetTypeId
        - manufacturerId
        - modelId
        - category
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        assetTypeId:
          type: string
        manufacturerId:
          type: string
        modelId:
          type: string
        category:
          $ref: '#/components/schemas/AssetCategory'
        status:
          $ref: '#/components/schemas/AssetStatus'
        serialNumber:
          type: string
        ratedPowerW:
          type: number
        capacityWh:
          type: number
        lastSeenAt:
          type: string
          format: date-time
        latestReading:
          $ref: '#/components/schemas/AssetReading'
        openAlertCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      examples:
        - id: 22222222-2222-4222-8222-222222222222
          householdId: 11111111-1111-4111-8111-111111111111
          name: Roof array
          assetTypeId: solar_inverter
          manufacturerId: sunra
          modelId: sunra-x7
          category: production
          status: online
          ratedPowerW: 7000
          lastSeenAt: '2026-09-12T08:55:00Z'
          latestReading:
            powerW: 4210
            energyTodayWh: 18400
            measuredAt: '2026-09-12T08:55:00Z'
          openAlertCount: 0
          createdAt: '2026-02-02T11:30:00Z'
    AssetCreate:
      type: object
      required: [name, assetTypeId, manufacturerId, modelId, credentials]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        assetTypeId:
          type: string
        manufacturerId:
          type: string
        modelId:
          type: string
        credentials:
          type: object
          description: |
            Keyed by the model's connection parameter keys. Write only: no endpoint ever
            returns these values back.
          additionalProperties:
            type: string
    AssetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        credentials:
          type: object
          additionalProperties:
            type: string
    AssetPage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Asset'
    TelemetryPoint:
      type: object
      required: [t, value]
      properties:
        t:
          type: string
          format: date-time
          description: Start of the bucket.
        value:
          type: [number, 'null']
          description: Null marks a gap, which charts must render as a break, not a zero.
    TelemetrySeries:
      type: object
      required: [metric, unit, points]
      properties:
        metric:
          type: string
        unit:
          $ref: '#/components/schemas/Unit'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryPoint'
    TelemetryResponse:
      type: object
      required: [from, to, resolution, series]
      properties:
        assetId:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        resolution:
          $ref: '#/components/schemas/Resolution'
        series:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySeries'
      examples:
        - householdId: 11111111-1111-4111-8111-111111111111
          from: '2026-09-12T00:00:00Z'
          to: '2026-09-12T04:00:00Z'
          resolution: hour
          series:
            - metric: production
              unit: W
              points:
                - { t: '2026-09-12T00:00:00Z', value: 0 }
                - { t: '2026-09-12T01:00:00Z', value: 0 }
                - { t: '2026-09-12T02:00:00Z', value: 130 }
                - { t: '2026-09-12T03:00:00Z', value: 890 }
            - metric: consumption
              unit: W
              points:
                - { t: '2026-09-12T00:00:00Z', value: 410 }
                - { t: '2026-09-12T01:00:00Z', value: 380 }
                - { t: '2026-09-12T02:00:00Z', value: 395 }
                - { t: '2026-09-12T03:00:00Z', value: 1240 }
    LogSeverity:
      type: string
      enum: [debug, info, warning, error, critical]
    LogSource:
      type: string
      enum: [device, manufacturerCloud, platform]
    LogEntry:
      type: object
      required: [id, assetId, ts, severity, source, message]
      properties:
        id:
          type: string
        assetId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        severity:
          $ref: '#/components/schemas/LogSeverity'
        source:
          $ref: '#/components/schemas/LogSource'
        code:
          type: string
          description: Manufacturer fault code, as reported.
        message:
          type: string
        raw:
          type: object
          additionalProperties: true
          description: Untouched payload, shown to installers for diagnosis.
      examples:
        - id: log_01J8
          assetId: 22222222-2222-4222-8222-222222222222
          ts: '2026-09-12T07:41:12Z'
          severity: error
          source: device
          code: F013
          message: Grid voltage out of range, inverter stopped exporting.
    LogEntryPage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LogEntry'
    AlertStatus:
      type: string
      enum: [open, acknowledged, resolved]
    AlertSeverity:
      type: string
      enum: [warning, critical]
    AlertSource:
      type: string
      description: What the platform derived this alert from.
      enum: [deviceLog, telemetryThreshold, connectivity]
    Alert:
      type: object
      required:
        - id
        - householdId
        - assetId
        - code
        - severity
        - status
        - title
        - derivedFrom
        - firstSeenAt
        - lastSeenAt
        - occurrences
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        householdName:
          type: string
          description: Present in the cross-household view, where one name is not enough.
        assetName:
          type: string
        code:
          type: string
          description: Stable identifier for this kind of problem.
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        title:
          type: string
        detail:
          type: string
        derivedFrom:
          $ref: '#/components/schemas/AlertSource'
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        occurrences:
          type: integer
          description: How many underlying events collapsed into this alert.
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedByUserId:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
      examples:
        - id: 33333333-3333-4333-8333-333333333333
          householdId: 11111111-1111-4111-8111-111111111111
          assetId: 22222222-2222-4222-8222-222222222222
          assetName: Roof array
          code: inverter_grid_voltage
          severity: critical
          status: open
          title: Inverter stopped exporting
          detail: Grid voltage has been out of range since 07:41.
          derivedFrom: deviceLog
          firstSeenAt: '2026-09-12T07:41:12Z'
          lastSeenAt: '2026-09-12T08:55:00Z'
          occurrences: 47
    AlertStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [acknowledged, resolved]
    AlertPage:
      type: object
      required: [data, nextCursor]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
